apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: debug-dojo-hpa
  namespace: dojo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dojo-deployment

  minReplicas: 1
  maxReplicas: 3

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
